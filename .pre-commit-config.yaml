# See https://pre-commit.com for usage:
#   pip install pre-commit && pre-commit install
# The gitleaks hooks below also need the gitleaks binary on PATH.

# `unsupported_script` (the local gitleaks hooks) needs pre-commit 4.4+.
minimum_pre_commit_version: "4.4.0"
# A plain `pre-commit install` sets up every git hook type used below.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# Hooks run at commit time unless they set their own stages (as gitleaks does).
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff version pinned in pyproject.toml ([dev] extra).
    rev: v0.16.10
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Keep in sync with the mypy version locked in uv.lock (pyproject.toml only
    # sets a floor, so CI also resolves the latest release).
    rev: v2.4.0
    hooks:
      - id: mypy
        # Type-check only the package; tests are not under strict typing.
        files: ^httpmocker/
        # mypy needs the typed runtime deps available to resolve their stubs
        # and to load the pydantic mypy plugin.
        additional_dependencies:
          - pydantic>=2.11
          - rich>=14.0

  # Secret scanning with gitleaks (config: .gitleaks.toml) on every channel a
  # secret can enter through: staged content, the commit message, and the
  # pushed commits. Local hooks are advisory (--no-verify skips them); the CI
  # workflow .github/workflows/gitleaks.yml is the non-bypassable layer.
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: scripts/gitleaks/staged.sh
        language: unsupported_script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks-commit-msg
        name: gitleaks (commit message)
        entry: scripts/gitleaks/commit-msg.sh
        language: unsupported_script
        stages: [commit-msg]
      - id: gitleaks-pre-push
        name: gitleaks (pushed commits)
        entry: scripts/gitleaks/pre-push.sh
        language: unsupported_script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
